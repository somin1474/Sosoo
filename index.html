<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>🎵 Pocket Music Editor</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3efff;
  color: #26202f;
  font-family: Arial, "Noto Sans KR", sans-serif;
}

header {
  background: #7655c8;
  color: white;
  padding: 18px 15px;
  text-align: center;
  box-shadow: 0 3px 12px #0002;
}

header h1 {
  margin: 0;
  font-size: 23px;
}

header p {
  margin: 7px 0 0;
  font-size: 13px;
  opacity: .9;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 15px;
  box-shadow: 0 3px 15px #0001;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 11px 14px;
  background: #7655c8;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

button.secondary {
  background: #e9e2ff;
  color: #5738a5;
}

button.danger {
  background: #e34f63;
}

button.dark {
  background: #40394b;
}

input[type=file] {
  width: 100%;
  padding: 12px;
  background: #f5f2fc;
  border-radius: 12px;
}

.track {
  border: 2px solid #eee8ff;
  border-radius: 16px;
  padding: 13px;
  margin-top: 12px;
}

.track.selected {
  border-color: #7655c8;
}

.track-title {
  display: flex;
  align-items: center;
  gap: 8px;
}

.track-title strong {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.wave-wrap {
  margin-top: 12px;
  background: #f2eff8;
  border-radius: 10px;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 95px;
}

.time {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #777;
  margin-top: 5px;
}

.control {
  margin-top: 13px;
}

.control label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 5px;
}

input[type=range] {
  width: 100%;
  accent-color: #7655c8;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.small {
  font-size: 12px;
  color: #777;
}

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.player {
  position: sticky;
  bottom: 10px;
  z-index: 10;
}

.big-buttons {
  display: flex;
  justify-content: center;
  gap: 9px;
}

.big-buttons button {
  min-width: 60px;
  font-size: 20px;
}

.timeline {
  height: 70px;
  background: #eeeafa;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  margin-top: 10px;
}

.timeline-track {
  height: 42px;
  position: absolute;
  top: 14px;
  border-radius: 8px;
  background: #7655c8;
  color: white;
  padding: 12px 8px;
  font-size: 11px;
  overflow: hidden;
  white-space: nowrap;
}

.playhead {
  position: absolute;
  width: 2px;
  height: 100%;
  background: red;
  left: 0;
  top: 0;
  z-index: 5;
}

.notice {
  background: #f1ecff;
  border-radius: 12px;
  padding: 12px;
  font-size: 12px;
  line-height: 1.6;
  color: #55476e;
}

.empty {
  text-align: center;
  color: #888;
  padding: 35px 10px;
}

h2 {
  font-size: 17px;
  margin-top: 0;
}

.value {
  color: #7655c8;
  font-weight: bold;
}

@media(max-width:500px) {
  .grid {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 21px;
  }

  button {
    padding: 10px 12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎵 Pocket Music Editor</h1>
  <p>휴대폰에서 사용하는 간단한 음악 편집기</p>
</header>

<div class="container">

  <div class="card">
    <h2>📂 음악 추가</h2>

    <input
      id="fileInput"
      type="file"
      accept="audio/*"
      multiple
    >

    <div style="height:10px"></div>

    <div class="notice">
      음악 파일은 이 브라우저 안에서 처리됩니다.<br>
      서버에 음악 파일을 업로드하지 않습니다.
    </div>
  </div>


  <div class="card">
    <h2>🎬 타임라인</h2>

    <div id="timeline" class="timeline">
      <div id="playhead" class="playhead"></div>
    </div>
  </div>


  <div id="tracks" class="card">
    <h2>🎵 트랙</h2>

    <div id="empty" class="empty">
      아직 음악이 없습니다.<br>
      위에서 음악 파일을 추가해주세요.
    </div>
  </div>


  <div id="editor" class="card" style="display:none">

    <h2>🎚️ 선택한 트랙 편집</h2>

    <div id="selectedName" class="small"></div>

    <div class="control">
      <label>
        <span>🔊 볼륨</span>
        <span id="volumeValue" class="value">100%</span>
      </label>

      <input
        id="volume"
        type="range"
        min="0"
        max="150"
        value="100"
      >
    </div>


    <div class="control">
      <label>
        <span>🎚️ 음정</span>
        <span id="pitchValue" class="value">0 반음</span>
      </label>

      <input
        id="pitch"
        type="range"
        min="-12"
        max="12"
        value="0"
      >
    </div>


    <div class="control">
      <label>
        <span>⏩ 속도</span>
        <span id="speedValue" class="value">1.00x</span>
      </label>

      <input
        id="speed"
        type="range"
        min="0.5"
        max="2"
        step="0.01"
        value="1"
      >
    </div>


    <div class="grid">

      <div class="control">
        <label>
          <span>✂️ 시작 위치</span>
          <span id="startValue" class="value">0.00s</span>
        </label>

        <input
          id="trimStart"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0"
        >
      </div>


      <div class="control">
        <label>
          <span>✂️ 끝 위치</span>
          <span id="endValue" class="value">0.00s</span>
        </label>

        <input
          id="trimEnd"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
        >
      </div>

    </div>


    <h3>🎛️ 음색</h3>

    <div class="control">
      <label>
        <span>저음</span>
        <span id="bassValue" class="value">0 dB</span>
      </label>

      <input
        id="bass"
        type="range"
        min="-15"
        max="15"
        value="0"
      >
    </div>


    <div class="control">
      <label>
        <span>고음</span>
        <span id="trebleValue" class="value">0 dB</span>
      </label>

      <input
        id="treble"
        type="range"
        min="-15"
        max="15"
        value="0"
      >
    </div>


    <div class="control">
      <label>
        <span>🔁 에코</span>
        <span id="echoValue" class="value">0%</span>
      </label>

      <input
        id="echo"
        type="range"
        min="0"
        max="70"
        value="0"
      >
    </div>


    <div style="height:10px"></div>

    <div class="row">

      <button id="muteBtn" class="secondary">
        🔇 음소거
      </button>

      <button id="resetBtn" class="secondary">
        ↩️ 초기화
      </button>

      <button id="removeBtn" class="danger">
        🗑️ 트랙 삭제
      </button>

    </div>

  </div>


  <div class="card player">

    <div class="big-buttons">

      <button id="backBtn" class="secondary">
        ⏪
      </button>

      <button id="playBtn">
        ▶️
      </button>

      <button id="stopBtn" class="dark">
        ⏹️
      </button>

      <button id="forwardBtn" class="secondary">
        ⏩
      </button>

    </div>

    <div style="height:10px"></div>

    <div id="currentTime" style="text-align:center">
      00:00 / 00:00
    </div>

  </div>


  <div class="card">

    <h2>💾 저장</h2>

    <button id="exportBtn" style="width:100%;font-size:16px">
      💾 WAV 파일로 저장
    </button>

    <div style="height:10px"></div>

    <div class="small">
      저장할 때 편집된 트랙들을 하나의 WAV 파일로 합칩니다.
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.js"></script>

<script>

let tracks = [];
let selectedIndex = -1;

let audioContext = null;
let masterGain = null;

let playing = false;
let startedAt = 0;
let animation = null;


/* =========================
   기본 초기화
========================= */

function initAudio() {

  if (!audioContext) {

    audioContext =
      new (window.AudioContext ||
           window.webkitAudioContext)();

    masterGain =
      audioContext.createGain();

    masterGain.gain.value = 1;

    masterGain.connect(
      audioContext.destination
    );
  }
}


/* =========================
   파일 추가
========================= */

document
.getElementById("fileInput")
.addEventListener("change", async function(e) {

  initAudio();

  const files = [...e.target.files];

  for (const file of files) {

    try {

      const arrayBuffer =
        await file.arrayBuffer();

      const buffer =
        await audioContext.decodeAudioData(
          arrayBuffer
        );

      tracks.push({

        name: file.name,

        buffer: buffer,

        volume: 1,

        pitch: 0,

        speed: 1,

        trimStart: 0,

        trimEnd: buffer.duration,

        bass: 0,

        treble: 0,

        echo: 0,

        muted: false

      });

    } catch(err) {

      alert(
        "파일을 불러오지 못했습니다: " +
        file.name
      );

    }

  }

  renderTracks();

  e.target.value = "";

});


/* =========================
   트랙 표시
========================= */

function renderTracks() {

  const box =
    document.getElementById("tracks");

  const empty =
    document.getElementById("empty");

  if (tracks.length === 0) {

    empty.style.display = "block";

    box.innerHTML =
      "<h2>🎵 트랙</h2>" +
      empty.outerHTML;

    return;
  }

  box.innerHTML =
    "<h2>🎵 트랙</h2>";

  tracks.forEach((track, index) => {

    const div =
      document.createElement("div");

    div.className =
      "track" +
      (index === selectedIndex
        ? " selected"
        : "");

    const duration =
      track.buffer.duration;

    div.innerHTML = `

      <div class="track-title">

        <span>🎵</span>

        <strong>${escapeHtml(track.name)}</strong>

        <button
          class="secondary"
          onclick="selectTrack(${index})"
        >
          편집
        </button>

      </div>

      <div class="wave-wrap">

        <canvas
          id="wave-${index}"
          width="800"
          height="180"
        ></canvas>

      </div>

      <div class="time">

        <span>
          ${formatTime(track.trimStart)}
        </span>

        <span>
          ${formatTime(track.trimEnd)}
        </span>

      </div>

    `;

    box.appendChild(div);

    drawWaveform(
      track,
      document.getElementById(
        "wave-" + index
      )
    );

  });

  updateTimeline();
}


/* =========================
   파형
========================= */

function drawWaveform(track, canvas) {

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const data =
    track.buffer.getChannelData(0);

  const step =
    Math.ceil(data.length /
              canvas.width);

  const amp =
    canvas.height / 2;

  ctx.beginPath();

  for (
    let i = 0;
    i < canvas.width;
    i++
  ) {

    let min = 1;
    let max = -1;

    const start =
      i * step;

    const end =
      Math.min(
        start + step,
        data.length
      );

    for (
      let j = start;
      j < end;
      j++
    ) {

      const value = data[j];

      if (value < min) min = value;
      if (value > max) max = value;

    }

    ctx.moveTo(
      i,
      (1 + min) * amp
    );

    ctx.lineTo(
      i,
      (1 + max) * amp
    );
  }

  ctx.stroke();
}


/* =========================
   트랙 선택
========================= */

function selectTrack(index) {

  selectedIndex = index;

  const track =
    tracks[index];

  document
    .getElementById("editor")
    .style.display = "block";

  document
    .getElementById("selectedName")
    .textContent =
      track.name;

  document
    .getElementById("volume")
    .value =
      track.volume * 100;

  document
    .getElementById("pitch")
    .value =
      track.pitch;

  document
    .getElementById("speed")
    .value =
      track.speed;

  document
    .getElementById("trimStart")
    .max =
      track.buffer.duration;

  document
    .getElementById("trimStart")
    .value =
      track.trimStart;

  document
    .getElementById("trimEnd")
    .max =
      track.buffer.duration;

  document
    .getElementById("trimEnd")
    .value =
      track.trimEnd;

  document
    .getElementById("bass")
    .value =
      track.bass;

  document
    .getElementById("treble")
    .value =
      track.treble;

  document
    .getElementById("echo")
    .value =
      track.echo;

  updateLabels();

  renderTracks();

}


/* =========================
   컨트롤
========================= */

function selectedTrack() {

  if (
    selectedIndex < 0 ||
    !tracks[selectedIndex]
  ) {
    return null;
  }

  return tracks[selectedIndex];
}


document
.getElementById("volume")
.addEventListener("input", function() {

  const t = selectedTrack();

  if (!t) return;

  t.volume =
    Number(this.value) / 100;

  updateLabels();

});


document
.getElementById("pitch")
.addEventListener("input", function() {

  const t = selectedTrack();

  if (!t) return;

  t.pitch =
    Number(this.value);

  updateLabels();

});


document
.getElementById("speed")
.addEventListener("input", function() {

  const t = selectedTrack();

  if (!t) return;

  t.speed =
    Number(this.value);

  updateLabels();

});


document
.getElementById("trimStart")
.addEventListener("input", function() {

  const t = selectedTrack();

  if (!t) return;

  let value =
    Number(this.value);

  if (value >= t.trimEnd) {

    value =
      Math.max(
        0,
        t.trimEnd - 0.1
      );

    this.value = value;
  }

  t.trimStart = value;

  updateLabels();

  renderTracks();

});


document
.getElementById("trimEnd")
.addEventListener("input", function() {

  const t = selectedTrack();

  if (!t) return;

  let value =
    Number(this.value);

  if (value <= t.trimStart) {

    value =
      Math.min(
        t.buffer.duration,
        t.trimStart + 0.1
      );

    this.value = value;
  }

  t.trimEnd = value;

  updateLabels();

  renderTracks();

});


document
.getElementById("bass")
.addEventListener("input", function() {

  const t = selectedTrack();

  if (!t) return;

  t.bass =
    Number(this.value);

  updateLabels();

});


document
.getElementById("treble")
.addEventListener("input", function() {

  const t = selectedTrack();

  if (!t) return;

  t.treble =
    Number(this.value);

  updateLabels();

});


document
.getElementById("echo")
.addEventListener("input", function() {

  const t = selectedTrack();

  if (!t) return;

  t.echo =
    Number(this.value);

  updateLabels();

});


function updateLabels() {

  const t = selectedTrack();

  if (!t) return;

  document
    .getElementById("volumeValue")
    .textContent =
      Math.round(t.volume * 100) + "%";

  document
    .getElementById("pitchValue")
    .textContent =
      (t.pitch > 0 ? "+" : "") +
      t.pitch +
      " 반음";

  document
    .getElementById("speedValue")
    .textContent =
      t.speed.toFixed(2) + "x";

  document
    .getElementById("startValue")
    .textContent =
      t.trimStart.toFixed(2) + "s";

  document
    .getElementById("endValue")
    .textContent =
      t.trimEnd.toFixed(2) + "s";

  document
    .getElementById("bassValue")
    .textContent =
      (t.bass > 0 ? "+" : "") +
      t.bass +
      " dB";

  document
    .getElementById("trebleValue")
    .textContent =
      (t.treble > 0 ? "+" : "") +
      t.treble +
      " dB";

  document
    .getElementById("echoValue")
    .textContent =
      t.echo + "%";

}


/* =========================
   음소거
========================= */

document
.getElementById("muteBtn")
.addEventListener("click", function() {

  const t = selectedTrack();

  if (!t) return;

  t.muted =
    !t.muted;

  this.textContent =
    t.muted
      ? "🔊 음소거 해제"
      : "🔇 음소거";

});


/* =========================
   초기화
========================= */

document
.getElementById("resetBtn")
.addEventListener("click", function() {

  const t = selectedTrack();

  if (!t) return;

  t.volume = 1;
  t.pitch = 0;
  t.speed = 1;
  t.trimStart = 0;
  t.trimEnd =
    t.buffer.duration;
  t.bass = 0;
  t.treble = 0;
  t.echo = 0;
  t.muted = false;

  selectTrack(selectedIndex);

});


/* =========================
   삭제
========================= */

document
.getElementById("removeBtn")
.addEventListener("click", function() {

  if (selectedIndex < 0) return;

  stopPlayback();

  tracks.splice(
    selectedIndex,
    1
  );

  selectedIndex = -1;

  document
    .getElementById("editor")
    .style.display = "none";

  renderTracks();

});


/* =========================
   Web Audio 재생
========================= */

let activeSources = [];

function createSource(track) {

  const source =
    audioContext.createBufferSource();

  source.buffer =
    track.buffer;

  source.playbackRate.value =
    track.speed;

  const gain =
    audioContext.createGain();

  gain.gain.value =
    track.muted
      ? 0
      : track.volume;

  const bass =
    audioContext.createBiquadFilter();

  bass.type =
    "lowshelf";

  bass.frequency.value =
    180;

  bass.gain.value =
    track.bass;

  const treble =
    audioContext.createBiquadFilter();

  treble.type =
    "highshelf";

  treble.frequency.value =
    3000;

  treble.gain.value =
    track.treble;

  const delay =
    audioContext.createDelay(2);

  delay.delayTime.value =
    0.25;

  const echoGain =
    audioContext.createGain();

  echoGain.gain.value =
    track.echo / 100;

  source.connect(gain);

  gain.connect(bass);

  bass.connect(treble);

  treble.connect(
    masterGain
  );

  if (track.echo > 0) {

    treble.connect(delay);

    delay.connect(echoGain);

    echoGain.connect(
      masterGain
    );
  }

  return source;
}


/*

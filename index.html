<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎵 Pocket Music Editor</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3efff;
  color:#292333;
  font-family:Arial,"Noto Sans KR",sans-serif;
}

header{
  background:#7655c8;
  color:white;
  text-align:center;
  padding:22px 15px;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:7px 0 0;
  opacity:.9;
}

.container{
  max-width:850px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 4px 18px #0001;
}

h2{
  margin-top:0;
}

input[type=file]{
  width:100%;
  padding:13px;
  background:#f5f1ff;
  border-radius:12px;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 15px;
  background:#7655c8;
  color:white;
  font-size:14px;
}

button:active{
  transform:scale(.97);
}

button.secondary{
  background:#e9e1ff;
  color:#5b3bab;
}

button.danger{
  background:#e05265;
}

button.dark{
  background:#403949;
}

.track{
  border:2px solid #eee8ff;
  border-radius:16px;
  padding:14px;
  margin-top:12px;
}

.track.selected{
  border-color:#7655c8;
}

.track-head{
  display:flex;
  align-items:center;
  gap:8px;
}

.track-head strong{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.status{
  margin-top:8px;
  font-size:12px;
  color:#777;
}

canvas{
  width:100%;
  height:100px;
  display:block;
}

.wave{
  margin-top:12px;
  background:#f0edf7;
  border-radius:10px;
  overflow:hidden;
}

.control{
  margin-top:15px;
}

.control label{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
  font-size:14px;
}

input[type=range]{
  width:100%;
  accent-color:#7655c8;
}

.value{
  color:#7655c8;
  font-weight:bold;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.notice{
  background:#f1ebff;
  padding:13px;
  border-radius:13px;
  font-size:13px;
  line-height:1.6;
  margin-top:12px;
}

.timeline{
  height:100px;
  background:#eeeafa;
  border-radius:14px;
  position:relative;
  overflow:hidden;
}

.timelineBlock{
  position:absolute;
  height:55px;
  top:22px;
  background:#7655c8;
  color:white;
  border-radius:9px;
  padding:18px 8px;
  font-size:11px;
  overflow:hidden;
  white-space:nowrap;
}

.player{
  position:sticky;
  bottom:10px;
  z-index:10;
}

.playerButtons{
  display:flex;
  justify-content:center;
  gap:9px;
}

.playerButtons button{
  min-width:60px;
  font-size:20px;
}

.time{
  text-align:center;
  margin-top:10px;
}

.empty{
  text-align:center;
  color:#999;
  padding:30px 10px;
}

@media(max-width:500px){
  header h1{
    font-size:22px;
  }

  .container{
    padding:10px;
  }

  .card{
    padding:15px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎵 Pocket Music Editor</h1>
  <p>휴대폰에서 사용하는 음악 편집기</p>
</header>

<div class="container">

<!-- 파일 추가 -->
<div class="card">

<h2>📂 음악 추가</h2>

<input
  id="fileInput"
  type="file"
  accept="audio/*"
  multiple
>

<div class="notice">
🎵 MP3, WAV 등의 음악 파일을 선택하세요.<br>
파일은 이 브라우저에서만 처리됩니다.
</div>

</div>


<!-- 타임라인 -->
<div class="card">

<h2>🎬 타임라인</h2>

<div id="timeline" class="timeline"></div>

</div>


<!-- 트랙 -->
<div class="card">

<h2>🎵 트랙</h2>

<div id="tracks">

<div class="empty">
아직 음악이 없습니다.<br>
위에서 음악 파일을 추가해주세요.
</div>

</div>

</div>


<!-- 편집 -->
<div
  id="editor"
  class="card"
  style="display:none"
>

<h2>🎚️ 트랙 편집</h2>

<div id="selectedName"></div>


<div class="control">

<label>
<span>🔊 볼륨</span>
<span id="volumeValue" class="value">100%</span>
</label>

<input
  id="volume"
  type="range"
  min="0"
  max="150"
  value="100"
>

</div>


<div class="control">

<label>
<span>🎚️ 음정</span>
<span id="pitchValue" class="value">0 반음</span>
</label>

<input
  id="pitch"
  type="range"
  min="-12"
  max="12"
  value="0"
>

</div>


<div class="control">

<label>
<span>⏩ 속도</span>
<span id="speedValue" class="value">1.00x</span>
</label>

<input
  id="speed"
  type="range"
  min="0.5"
  max="2"
  step="0.01"
  value="1"
>

</div>


<div class="control">

<label>
<span>✂️ 시작</span>
<span id="startValue" class="value">0.00s</span>
</label>

<input
  id="trimStart"
  type="range"
  min="0"
  max="1"
  step="0.01"
  value="0"
>

</div>


<div class="control">

<label>
<span>✂️ 끝</span>
<span id="endValue" class="value">0.00s</span>
</label>

<input
  id="trimEnd"
  type="range"
  min="0"
  max="1"
  step="0.01"
  value="1"
>

</div>


<div class="control">

<label>
<span>🔉 저음</span>
<span id="bassValue" class="value">0 dB</span>
</label>

<input
  id="bass"
  type="range"
  min="-15"
  max="15"
  value="0"
>

</div>


<div class="control">

<label>
<span>🔊 고음</span>
<span id="trebleValue" class="value">0 dB</span>
</label>

<input
  id="treble"
  type="range"
  min="-15"
  max="15"
  value="0"
>

</div>


<div class="control">

<label>
<span>🔁 에코</span>
<span id="echoValue" class="value">0%</span>
</label>

<input
  id="echo"
  type="range"
  min="0"
  max="70"
  value="0"
>

</div>


<br>

<div class="row">

<button
  id="muteBtn"
  class="secondary"
>
🔇 음소거
</button>

<button
  id="resetBtn"
  class="secondary"
>
↩️ 초기화
</button>

<button
  id="removeBtn"
  class="danger"
>
🗑️ 삭제
</button>

</div>

</div>


<!-- 플레이어 -->
<div class="card player">

<div class="playerButtons">

<button
  id="backBtn"
  class="secondary"
>
⏪
</button>

<button id="playBtn">
▶️
</button>

<button
  id="stopBtn"
  class="dark"
>
⏹️
</button>

<button
  id="forwardBtn"
  class="secondary"
>
⏩
</button>

</div>

<div
  id="timeDisplay"
  class="time"
>
00:00 / 00:00
</div>

</div>


<!-- 저장 -->
<div class="card">

<h2>💾 저장</h2>

<button
  id="exportBtn"
  style="width:100%;font-size:16px"
>
💾 WAV 파일로 저장
</button>

</div>

</div>


<script>

/* =================================
   오디오 변수
================================= */

let audioContext = null;

let tracks = [];

let selectedIndex = -1;

let currentSources = [];

let playing = false;

let playStartedTime = 0;


/* =================================
   오디오 초기화
================================= */

function initAudio(){

  if(!audioContext){

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

}


/* =================================
   파일 선택
================================= */

document
.getElementById("fileInput")
.addEventListener(
  "change",
  handleFiles
);


async function handleFiles(event){

  initAudio();

  const files =
    Array.from(event.target.files);

  if(files.length === 0){
    return;
  }


  const tracksBox =
    document.getElementById("tracks");


  /* 처음 추가하는 경우 */
  if(
    tracks.length === 0
  ){

    tracksBox.innerHTML = "";

  }


  for(const file of files){

    /* --------------------------------
       먼저 화면에 표시
    -------------------------------- */

    const temporary =
      document.createElement("div");

    temporary.className = "track";

    temporary.innerHTML = `

      <div class="track-head">

        <span>🎵</span>

        <strong>
          ${escapeHTML(file.name)}
        </strong>

      </div>

      <div class="status">
        ⏳ 음악 파일 읽는 중...
      </div>

    `;

    tracksBox.appendChild(
      temporary
    );


    try{

      /* --------------------------------
         FileReader로 읽기
      -------------------------------- */

      const arrayBuffer =
        await readFile(file);


      /* --------------------------------
         오디오 디코딩
      -------------------------------- */

      const buffer =
        await decodeAudio(
          arrayBuffer
        );


      /* --------------------------------
         실제 트랙 생성
      -------------------------------- */

      const track = {

        name:file.name,

        buffer:buffer,

        volume:1,

        pitch:0,

        speed:1,

        trimStart:0,

        trimEnd:buffer.duration,

        bass:0,

        treble:0,

        echo:0,

        muted:false

      };


      tracks.push(track);


      /* 임시 표시 제거 */
      temporary.remove();


      /* 화면 다시 그리기 */
      renderTracks();

      updateTimeline();


    }catch(error){

      console.error(error);

      temporary.querySelector(
        ".status"
      ).textContent =
        "❌ 이 음악 파일을 읽지 못했습니다.";

      temporary.querySelector(
        ".status"
      ).style.color =
        "#e05265";

    }

  }


  event.target.value = "";

}


/* =================================
   FileReader
================================= */

function readFile(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        () => reject(
          reader.error
        );

      reader.readAsArrayBuffer(
        file
      );

    }
  );

}


/* =================================
   Audio Decode
================================= */

function decodeAudio(arrayBuffer){

  return new Promise(
    (resolve,reject)=>{

      audioContext.decodeAudioData(

        arrayBuffer,

        buffer => resolve(buffer),

        error => reject(error)

      );

    }
  );

}


/* =================================
   트랙 표시
================================= */

function renderTracks(){

  const box =
    document.getElementById(
      "tracks"
    );

  box.innerHTML =
    "<h2>🎵 트랙</h2>";


  if(tracks.length === 0){

    box.innerHTML += `

      <div class="empty">

        아직 음악이 없습니다.<br>
        위에서 음악 파일을 추가해주세요.

      </div>

    `;

    return;

  }


  tracks.forEach(
    (track,index)=>{

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "track" +
        (
          index === selectedIndex
          ? " selected"
          : ""
        );


      div.innerHTML = `

        <div class="track-head">

          <span>🎵</span>

          <strong>
            ${escapeHTML(track.name)}
          </strong>

          <button
            class="secondary"
            data-index="${index}"
          >
            편집
          </button>

        </div>

        <div class="status">

          ${track.buffer.duration.toFixed(2)}초

        </div>

        <div class="wave">

          <canvas
            id="wave-${index}"
            width="800"
            height="200"
          ></canvas>

        </div>

      `;


      div
      .querySelector("button")
      .addEventListener(
        "click",
        ()=>{
          selectTrack(index);
        }
      );


      box.appendChild(div);


      drawWave(
        track,
        document.getElementById(
          "wave-" + index
        )
      );

    }
  );

}


/* =================================
   파형 그리기
================================= */

function drawWave(
  track,
  canvas
){

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const data =
    track.buffer.getChannelData(0);


  const step =
    Math.ceil(
      data.length /
      canvas.width
    );


  const center =
    canvas.height / 2;


  ctx.beginPath();


  for(
    let x=0;
    x<canvas.width;
    x++
  ){

    const start =
      x * step;

    const end =
      Math.min(
        start + step,
        data.length
      );


    let min=1;
    let max=-1;


    for(
      let i=start;
      i<end;
      i++
    ){

      const v=data[i];

      if(v<min) min=v;
      if(v>max) max=v;

    }


    ctx.moveTo(
      x,
      center + min * center
    );

    ctx.lineTo(
      x,
      center + max * center
    );

  }


  ctx.stroke();

}


/* =================================
   트랙 선택
================================= */

function selectTrack(index){

  selectedIndex=index;

  const track=
    tracks[index];


  document
  .getElementById("editor")
  .style.display="block";


  document
  .getElementById("selectedName")
  .textContent=
    track.name;


  document
  .getElementById("volume")
  .value=
    track.volume*100;


  document
  .getElementById("pitch")
  .value=
    track.pitch;


  document
  .getElementById("speed")
  .value=
    track.speed;


  document
  .getElementById("trimStart")
  .max=
    track.buffer.duration;


  document
  .getElementById("trimStart")
  .value=
    track.trimStart;


  document
  .getElementById("trimEnd")
  .max=
    track.buffer.duration;


  document
  .getElementById("trimEnd")
  .value=
    track.trimEnd;


  document
  .getElementById("bass")
  .value=
    track.bass;


  document
  .getElementById("treble")
  .value=
    track.treble;


  document
  .getElementById("echo")
  .value=
    track.echo;


  updateLabels();

  renderTracks();

}


/* =================================
   편집값
================================= */

function getSelected(){

  if(
    selectedIndex < 0 ||
    !tracks[selectedIndex]
  ){

    return null;

  }

  return tracks[selectedIndex];

}


/* 볼륨 */

document
.getElementById("volume")
.addEventListener(
  "input",
  function(){

    const t=getSelected();

    if(!t)return;

    t.volume=
      Number(this.value)/100;

    updateLabels();

  }
);


/* 음정 */

document
.getElementById("pitch")
.addEventListener(
  "input",
  function(){

    const t=getSelected();

    if(!t)return;

    t.pitch=
      Number(this.value);

    updateLabels();

  }
);


/* 속도 */

document
.getElementById("speed")
.addEventListener(
  "input",
  function(){

    const t=getSelected();

    if(!t)return;

    t.speed=
      Number(this.value);

    updateLabels();

  }
);


/* 시작 */

document
.getElementById("trimStart")
.addEventListener(
  "input",
  function(){

    const t=getSelected();

    if(!t)return;

    let v=
      Number(this.value);


    if(v>=t.trimEnd){

      v=
        Math.max(
          0,
          t.trimEnd-0.01
        );

      this.value=v;

    }


    t.trimStart=v;

    updateLabels();

    renderTracks();

  }
);


/* 끝 */

document
.getElementById("trimEnd")
.addEventListener(
  "input",
  function(){

    const t=getSelected();

    if(!t)return;

    let v=
      Number(this.value);


    if(v<=t.trimStart){

      v=
        Math.min(
          t.buffer.duration,
          t.trimStart+0.01
        );

      this.value=v;

    }


    t.trimEnd=v;

    updateLabels();

    renderTracks();

  }
);


/* 저음 */

document
.getElementById("bass")
.addEventListener(
  "input",
  function(){

    const t=getSelected();

    if(!t)return;

    t.bass=
      Number(this.value);

    updateLabels();

  }
);


/* 고음 */

document
.getElementById("treble")
.addEventListener(
  "input",
  function(){

    const t=getSelected();

    if(!t)return;

    t.treble=
      Number(this.value);

    updateLabels();

  }
);


/* 에코 */

document
.getElementById("echo")
.addEventListener(
  "input",
  function(){

    const t=getSelected();

    if(!t)return;

    t.echo=
      Number(this.value);

    updateLabels();

  }
);


/* =================================
   라벨
================================= */

function updateLabels(){

  const t=getSelected();

  if(!t)return;


  document
  .getElementById("volumeValue")
  .textContent=
    Math.round(
      t.volume*100
    )+"%";


  document
  .getElementById("pitchValue")
  .textContent=
    (t.pitch>0?"+":"")+
    t.pitch+
    " 반음";


  document
  .getElementById("speedValue")
  .textContent=
    t.speed.toFixed(2)+"x";


  document
  .getElementById("startValue")
  .textContent=
    t.trimStart.toFixed(2)+"s";


  document
  .getElementById("endValue")
  .textContent=
    t.trimEnd.toFixed(2)+"s";


  document
  .getElementById("bassValue")
  .textContent=
    (t.bass>0?"+":"")+
    t.bass+" dB";


  document
  .getElementById("trebleValue")
  .textContent=
    (t.treble>0?"+":"")+
    t.treble+" dB";


  document
  .getElementById("echoValue")
  .textContent=
    t.echo+"%";

}


/* =================================
   음소거
================================= */

document
.getElementById("muteBtn")
.addEventListener(
  "click",
  function(){

    const t=getSelected();

    if(!t)return;

    t.muted=!t.muted;

    this.textContent=
      t.muted
      ? "🔊 음소거 해제"
      : "🔇 음소거";

  }
);


/* =================================
   초기화
================================= */

document
.getElementById("resetBtn")
.addEventListener(
  "click",
  function(){

    const t=getSelected();

    if(!t)return;

    t.volume=1;
    t.pitch=0;
    t.speed=1;
    t.trimStart=0;
    t.trimEnd=
      t.buffer.duration;
    t.bass=0;
    t.treble=0;
    t.echo=0;
    t.muted=false;

    selectTrack(
      selectedIndex
    );

  }
);


/* =================================
   삭제
================================= */

document
.getElementById("removeBtn")
.addEventListener(
  "click",
  function(){

    if(selectedIndex<0)
      return;


    stopPlayback();


    tracks.splice(
      selectedIndex,
      1
    );


    selectedIndex=-1;


    document
    .getElementById("editor")
    .style.display="none";


    renderTracks();

    updateTimeline();

  }
);


/* =================================
   재생
================================= */

async function play(){

  if(tracks.length===0){

    alert(
      "먼저 음악 파일을 추가해주세요."
    );

    return;

  }


  initAudio();

  await audioContext.resume();


  stopPlayback();


  const now=
    audioContext.currentTime;


  currentSources=[];


  tracks.forEach(
    track=>{

      if(track.muted)
        return;


      const source=
        audioContext
        .createBufferSource();


      source.buffer=
        track.buffer;


      /*
        현재 버전에서는
        속도를 안정적으로 적용.
      */

      source.playbackRate.value=
        track.speed;


      const gain=
        audioContext
        .createGain();


      gain.gain.value=
        track.volume;


      const bass=
        audioContext
        .createBiquadFilter();

      bass.type="lowshelf";
      bass.frequency.value=180;
      bass.gain.value=track.bass;


      const treble=
        audioContext
        .createBiquadFilter();

      treble.type="highshelf";
      treble.frequency.value=3000;
      treble.gain.value=track.treble;


      source.connect(gain);

      gain.connect(bass);

      bass.connect(treble);

      treble.connect(
        audioContext.destination
      );


      const duration=
        track.trimEnd-
        track.trimStart;


      source.start(
        now,
        track.trimStart,
        duration
      );


      currentSources.push(
        source
      );

    }
  );


  playing=true;

  playStartedTime=
    performance.now();


  document
  .getElementById("playBtn")
  .textContent="⏸️";


  updateTime();

}


/* =================================
   정지
================================= */

function stopPlayback(){

  currentSources.forEach(
    source=>{

      try{
        source.stop();
      }catch(e){}

    }
  );


  currentSources=[];

  playing=false;


  document
  .getElementById("playBtn")
  .textContent="▶️";

}


/* =================================
   재생 버튼
================================= */

document
.getElementById("playBtn")
.addEventListener(
  "click",
  function(){

    if(playing){

      stopPlayback();

    }else{

      play();

    }

  }
);


document
.getElementById("stopBtn")
.addEventListener(
  "click",
  stopPlayback
);


/* =================================

/* =================================
   전체 길이
================================= */

function getTotalDuration(){

  let max=0;


  tracks.forEach(
    track=>{

      const duration=
        (
          track.trimEnd-
          track.trimStart
        ) /
        track.speed;


      if(duration>max)
        max=duration;

    }
  );


  return max;

}


/* =================================
   시간 업데이트
================================= */

function updateTime(){

  if(!playing)
    return;


  const elapsed=
    (
      performance.now()-
      playStartedTime
    )/1000;


  const total=
    getTotalDuration();


  document
  .getElementById("timeDisplay")
  .textContent=
    formatTime(elapsed)+
    " / "+
    formatTime(total);


  if(elapsed>=total){

    stopPlayback();

    document
    .getElementById("timeDisplay")
    .textContent=
      "00:00 / "+
      formatTime(total);

    return;

  }


  requestAnimationFrame(
    updateTime
  );

}


/* =================================
   타임라인
================================= */

function updateTimeline(){

  const timeline=
    document.getElementById(
      "timeline"
    );


  timeline.innerHTML="";


  const total=
    getTotalDuration();


  if(!total)
    return;


  tracks.forEach(
    (track,index)=>{

      const block=
        document.createElement(
          "div"
        );


      block.className=
        "timelineBlock";


      const duration=
        (
          track.trimEnd-
          track.trimStart
        )/
        track.speed;


      block.style.left=
        "1%";


      block.style.width=
        Math.max(
          10,
          duration/total*97
        )+"%";


      block.style.top=
        (10+index*20)+"px";


      block.textContent=
        track.name;


      timeline.appendChild(
        block
      );

    }
  );

}


/* =================================
   WAV 저장
================================= */

document
.getElementById("exportBtn")
.addEventListener(
  "click",
  exportWav
);


async function exportWav(){

  if(tracks.length===0){

    alert(
      "저장할 음악이 없습니다."
    );

    return;

  }


  const button=
    document.getElementById(
      "exportBtn"
    );


  button.disabled=true;

  button.textContent=
    "⏳ WAV 만드는 중...";


  try{

    const sampleRate=44100;

    const total=
      getTotalDuration();


    const offline=
      new OfflineAudioContext(
        2,
        Math.ceil(
          total*sampleRate
        ),
        sampleRate
      );


    const destination=
      offline.createGain();


    destination.connect(
      offline.destination
    );


    tracks.forEach(
      track=>{

        const source=
          offline
          .createBufferSource();


        source.buffer=
          track.buffer;


        source.playbackRate.value=
          track.speed;


        const gain=
          offline.createGain();


        gain.gain.value=
          track.muted
          ? 0
          : track.volume;


        const bass=
          offline
          .createBiquadFilter();


        bass.type="lowshelf";

        bass.frequency.value=180;

        bass.gain.value=
          track.bass;


        const treble=
          offline
          .createBiquadFilter();


        treble.type="highshelf";

        treble.frequency.value=3000;

        treble.gain.value=
          track.treble;


        source.connect(gain);

        gain.connect(bass);

        bass.connect(treble);

        treble.connect(
          destination
        );


        source.start(
          0,
          track.trimStart,
          track.trimEnd-
          track.trimStart
        );

      }
    );


    const rendered=
      await offline.startRendering();


    const wav=
      bufferToWav(rendered);


    const blob=
      new Blob(
        [wav],
        {type:"audio/wav"}
      );


    const url=
      URL.createObjectURL(blob);


    const a=
      document.createElement("a");


    a.href=url;

    a.download=
      "Pocket-Music-Edited.wav";


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      ()=>{
        URL.revokeObjectURL(url);
      },
      1000
    );


  }catch(error){

    console.error(error);

    alert(
      "WAV 저장 중 오류가 발생했습니다."
    );

  }


  button.disabled=false;

  button.textContent=
    "💾 WAV 파일로 저장";

}


/* =================================
   WAV 변환
================================= */

function bufferToWav(buffer){

  const channels=
    buffer.numberOfChannels;

  const sampleRate=
    buffer.sampleRate;

  const length=
    buffer.length*
    channels*
    2;


  const arrayBuffer=
    new ArrayBuffer(
      44+length
    );


  const view=
    new DataView(
      arrayBuffer
    );


  writeString(
    view,0,"RIFF"
  );


  view.setUint32(
    4,
    36+length,
    true
  );


  writeString(
    view,8,"WAVE"
  );


  writeString(
    view,12,"fmt "
  );


  view.setUint32(
    16,
    16,
    true
  );


  view.setUint16(
    20,
    1,
    true
  );


  view.setUint16(
    22,
    channels,
    true
  );


  view.setUint32(
    24,
    sampleRate,
    true
  );


  view.setUint32(
    28,
    sampleRate*
    channels*
    2,
    true
  );


  view.setUint16(
    32,
    channels*2,
    true
  );


  view.setUint16(
    34,
    16,
    true
  );


  writeString(
    view,36,"data"
  );


  view.setUint32(
    40,
    length,
    true
  );


  const data=[];


  for(
    let c=0;
    c<channels;
    c++
  ){

    data.push(
      buffer.getChannelData(c)
    );

  }


  let offset=44;


  for(
    let i=0;
    i<buffer.length;
    i++
  ){

    for(
      let c=0;
      c<channels;
      c++
    ){

      let sample=
        data[c][i];


      sample=
        Math.max(
          -1,
          Math.min(
            1,
            sample
          )
        );


      const value=
        sample<0
        ? sample*0x8000
        : sample*0x7fff;


      view.setInt16(
        offset,
        value,
        true
      );


      offset+=2;

    }

  }


  return arrayBuffer;

}


function writeString(
  view,
  offset,
  string
){

  for(
    let i=0;
    i<string.length;
    i++
  ){

    view.setUint8(
      offset+i,
      string.charCodeAt(i)
    );

  }

}


/* =================================
   시간
================================= */

function formatTime(seconds){

  seconds=
    Math.max(
      0,
      Math.floor(seconds)
    );


  const min=
    Math.floor(
      seconds/60
    );


  const sec=
    seconds%60;


  return(
    String(min)
    .padStart(2,"0")+
    ":"+
    String(sec)
    .padStart(2,"0")
  );

}


/* =================================
   HTML 안전 처리
================================= */

function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
